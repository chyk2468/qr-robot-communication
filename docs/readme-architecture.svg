<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">QR-Link workflow</title><desc id="desc">A structured message is encoded as a QR image, transmitted through a camera-visible display, decoded by the receiving side, and validated before dispatch.</desc><rect width="1200" height="400" rx="18" fill="#F3F3EF"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#2F7775">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#262D2F">QR-Link</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#6D7778">Robot message to optical transfer and validated command</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#D8DEDB"/><path d="M 300 237 L 330 237" stroke="#6D7778" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#6D7778" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#6D7778" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#6D7778" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#6D7778" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#6D7778" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#2F7775"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#2F7775">01 / ENCODE</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#262D2F">Structured payload</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D7778">Prepare a protocol message.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#B77B3E"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#B77B3E">02 / OPTICAL LINK</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#262D2F">QR image</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D7778">Transmit without an RF link.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#557B94"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#557B94">03 / DECODE</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#262D2F">Camera + OpenCV</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D7778">Recover the message from frames.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#FFFFFF" stroke="#D8DEDB" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#2F7775"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#2F7775">04 / VALIDATE</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#262D2F">Schema + routing</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D7778">Check message shape before handling.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#2F7775">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6D7778">Validate sender intent, message integrity, freshness, and robot safety rules before executing commands.</text></svg>