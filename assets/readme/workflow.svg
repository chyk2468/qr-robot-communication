<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">QR-Link Workflow</title>
  <desc id="svg-desc">End-to-End Operational Workflow</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06140F"/>
      <stop offset="100%" stop-color="#0D241C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D241C"/>
      <stop offset="100%" stop-color="#06140F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#153B2E" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="48" y="46" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">QR-LINK WORKFLOW</text>
  <text x="48" y="70" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">End-to-End Operational Workflow</text>
  <g filter="url(#glow)">
    <rect x="48" y="100" width="260" height="204" rx="12" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
    <rect x="48" y="100" width="260" height="5" rx="2.5" fill="#10B981"/>
    <text x="64" y="132" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">01 / BUILD</text>
    <text x="64" y="160" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Command</text>
    <text x="64" y="188" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12">Typed message</text>
  </g>
  <path d="M 311 202.0 L 323 202.0" stroke="#6EE7B7" stroke-width="1.8" stroke-dasharray="2,2"/>
  <path d="M 319 198.0 L 324 202.0 L 319 206.0" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <rect x="328" y="100" width="260" height="204" rx="12" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
    <rect x="328" y="100" width="260" height="5" rx="2.5" fill="#34D399"/>
    <text x="344" y="132" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">02 / SHOW</text>
    <text x="344" y="160" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">QR</text>
    <text x="344" y="188" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12">Display or file</text>
  </g>
  <path d="M 591 202.0 L 603 202.0" stroke="#6EE7B7" stroke-width="1.8" stroke-dasharray="2,2"/>
  <path d="M 599 198.0 L 604 202.0 L 599 206.0" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <rect x="608" y="100" width="260" height="204" rx="12" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
    <rect x="608" y="100" width="260" height="5" rx="2.5" fill="#10B981"/>
    <text x="624" y="132" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">03 / SEE</text>
    <text x="624" y="160" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Camera</text>
    <text x="624" y="188" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12">Preprocess + decode</text>
  </g>
  <path d="M 871 202.0 L 883 202.0" stroke="#6EE7B7" stroke-width="1.8" stroke-dasharray="2,2"/>
  <path d="M 879 198.0 L 884 202.0 L 879 206.0" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <rect x="888" y="100" width="260" height="204" rx="12" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
    <rect x="888" y="100" width="260" height="5" rx="2.5" fill="#34D399"/>
    <text x="904" y="132" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">04 / ACT</text>
    <text x="904" y="160" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Validate</text>
    <text x="904" y="188" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12">Optional verify</text>
  </g>
</svg>
