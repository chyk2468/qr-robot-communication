<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">QR-Link Banner</title>
  <desc id="svg-desc">Optical robot-to-robot messaging without RF, Wi-Fi, or Bluetooth</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06140F"/>
      <stop offset="100%" stop-color="#0D241C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D241C"/>
      <stop offset="100%" stop-color="#06140F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" stroke="#153B2E" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>
  <rect x="48" y="38" width="146" height="24" rx="12" fill="#153B2E" opacity="0.6"/>
  <text x="121" y="54" text-anchor="middle" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">IOT / HARDWARE</text>
  <text x="48" y="112" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">QR-Link</text>
  <text x="48" y="150" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">Optical robot-to-robot messaging without RF, Wi-Fi, or Bluetooth</text>
  <rect x="48" y="194" width="82" height="32" rx="16" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
  <text x="89" y="215" text-anchor="middle" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Python</text>
  <rect x="140" y="194" width="109" height="32" rx="16" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
  <text x="194" y="215" text-anchor="middle" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">streamlit</text>
  <rect x="259" y="194" width="127" height="32" rx="16" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
  <text x="322" y="215" text-anchor="middle" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">qrcode[pil]</text>
  <rect x="396" y="194" width="82" height="32" rx="16" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
  <text x="437" y="215" text-anchor="middle" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Pillow</text>
  <rect x="488" y="194" width="154" height="32" rx="16" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
  <text x="565" y="215" text-anchor="middle" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Robotics / com</text>
</svg>
