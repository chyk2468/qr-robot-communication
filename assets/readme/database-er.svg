<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">QR-Link Schema Database ER Diagram</title>
  <desc id="svg-desc">Schema models and relationships</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06140F"/>
      <stop offset="100%" stop-color="#0D241C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D241C"/>
      <stop offset="100%" stop-color="#06140F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#153B2E" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="48" y="46" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DATABASE ENTITY RELATIONSHIPS</text>
  <text x="48" y="70" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">QR-Link Schema</text>
  <g filter="url(#glow)">
    <rect x="48" y="96" width="250" height="244" rx="10" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
    <rect x="48" y="96" width="250" height="32" rx="10" fill="#153B2E"/>
    <text x="62" y="117" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">CommandPacket</text>
    <text x="62" y="150" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">packet_id (PK, Integer)</text>
    <text x="62" y="174" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">command_type (String)</text>
    <text x="62" y="198" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">payload (JSON)</text>
    <text x="62" y="222" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">crc_checksum (String)</text>
  </g>
  <path d="M 300 206 L 320 206" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="300" cy="206" r="3" fill="#10B981"/>
  <circle cx="320" cy="206" r="3" fill="#34D399"/>
  <g filter="url(#glow)">
    <rect x="322" y="96" width="250" height="244" rx="10" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
    <rect x="322" y="96" width="250" height="32" rx="10" fill="#153B2E"/>
    <text x="336" y="117" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">Coordinates3D</text>
    <text x="336" y="150" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">coord_id (PK, Integer)</text>
    <text x="336" y="174" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">packet_id (FK)</text>
    <text x="336" y="198" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">x (Float)</text>
    <text x="336" y="222" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">y (Float)</text>
    <text x="336" y="246" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">z (Float)</text>
    <text x="336" y="270" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">orientation (Float)</text>
  </g>
  <path d="M 574 206 L 594 206" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="574" cy="206" r="3" fill="#10B981"/>
  <circle cx="594" cy="206" r="3" fill="#34D399"/>
  <g filter="url(#glow)">
    <rect x="596" y="96" width="250" height="244" rx="10" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
    <rect x="596" y="96" width="250" height="32" rx="10" fill="#153B2E"/>
    <text x="610" y="117" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800">DockParameters</text>
    <text x="610" y="150" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">dock_id (PK, Integer)</text>
    <text x="610" y="174" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">station_id (String)</text>
    <text x="610" y="198" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">charge_target_pct (Float)</text>
    <text x="610" y="222" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">timeout_sec (Integer)</text>
  </g>
</svg>
