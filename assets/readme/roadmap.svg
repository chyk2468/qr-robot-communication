<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">QR-Link Roadmap</title>
  <desc id="svg-desc">Project Execution Roadmap</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06140F"/>
      <stop offset="100%" stop-color="#0D241C"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D241C"/>
      <stop offset="100%" stop-color="#06140F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#153B2E" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="48" y="46" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">PROJECT ROADMAP</text>
  <text x="48" y="70" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">QR-Link</text>
  <g filter="url(#glow)">
    <rect x="48" y="96" width="346" height="208" rx="12" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
    <rect x="48" y="96" width="346" height="4" rx="2" fill="#10B981"/>
    <text x="68" y="126" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">COMPLETED</text>
    <text x="68" y="160" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">✓</text>
    <text x="86" y="160" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Encoder/decoder</text>
    <text x="68" y="188" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">✓</text>
    <text x="86" y="188" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Protocol models</text>
    <text x="68" y="216" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">✓</text>
    <text x="86" y="216" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Streamlit UI</text>
    <text x="68" y="244" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">✓</text>
    <text x="86" y="244" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">pytest listed in requirements</text>
  </g>
  <g filter="url(#glow)">
    <rect x="420" y="96" width="346" height="208" rx="12" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
    <rect x="420" y="96" width="346" height="4" rx="2" fill="#38BDF8"/>
    <text x="440" y="126" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">IN PROGRESS</text>
    <text x="440" y="160" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12">None currently scheduled.</text>
  </g>
  <g filter="url(#glow)">
    <rect x="792" y="96" width="346" height="208" rx="12" fill="#0D241C" stroke="#153B2E" stroke-width="1.2"/>
    <rect x="792" y="96" width="346" height="4" rx="2" fill="#F59E0B"/>
    <text x="812" y="126" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">PLANNED</text>
    <text x="812" y="160" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">○</text>
    <text x="830" y="160" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Field tests on physical robots</text>
    <text x="812" y="188" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold">○</text>
    <text x="830" y="188" fill="#ECFDF5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">Lighting robustness metrics</text>
  </g>
</svg>
