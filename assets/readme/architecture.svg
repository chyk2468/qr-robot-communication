<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">QR-Link Architecture Architecture</title>
  <desc id="svg-desc">System Architecture Layers</desc>
  <defs>
